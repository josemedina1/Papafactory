<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PapaFactory</title>
    <script>
      // Aplica el tema guardado antes de dibujar la app para evitar un destello claro.
      try {
        var t = localStorage.getItem('temaPapaFactory') === 'oscuro' ? 'oscuro' : 'claro';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.bsTheme = t === 'oscuro' ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <script src="https://kit.fontawesome.com/97e73bf1af.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="contenedor-padre">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
